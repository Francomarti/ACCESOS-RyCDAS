<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accesos · RyCDAS</title>
<meta name="description" content="Todas las herramientas del equipo de Rindes y Cultivos DAS, en un solo lugar.">
<meta name="theme-color" content="#D9E6CF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141914" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accesos RyC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#D9E6CF; --surface:#F4F8EE; --ink:#1C2B1C; --muted:#526350; --rule:#B4C8A5;
  --accent:#DD7530; --accent-ink:#9C4A15;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141914; --surface:#1C231C; --ink:#E4E8DC; --muted:#9AA592; --rule:#334033;
    --accent:#E8894A; --accent-ink:#F0A874;
  }
}
:root[data-theme="dark"]{
  --bg:#141914; --surface:#1C231C; --ink:#E4E8DC; --muted:#9AA592; --rule:#334033;
  --accent:#E8894A; --accent-ink:#F0A874;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:14px 18px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0;font-size:clamp(28px,7vw,38px);line-height:1.05}
h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 2px;letter-spacing:-.005em}
p{margin:0}
.muted{color:var(--muted)}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* encabezado */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:inline-block;border-radius:8px;line-height:0}
.brand img{height:40px;width:auto;max-width:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{background:#fff;padding:5px 9px}}
:root[data-theme="dark"] .brand{background:#fff;padding:5px 9px}
.btn-instalar{border:0;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;white-space:nowrap}
.sub{margin-top:6px;font-size:14px}

/* compartir portal */
.compartir{display:flex;align-items:center;gap:10px;width:100%;margin-top:18px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:14px 18px;border-radius:14px;text-align:left}
.compartir svg{width:20px;height:20px;flex:none}
.compartir span{flex:1}
.compartir small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:1px}
.copiado{font-size:13px;color:var(--accent-ink);font-weight:600;margin-top:8px;height:16px}

/* secciones */
.seccion{margin-top:28px}
.seccion h2{margin-bottom:2px}
.seccion .desc{font-size:13px;margin-bottom:12px}

/* tarjetas */
.grid{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:13px 12px;cursor:pointer}
.card:active{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.mono{flex:none;width:42px;height:42px;border-radius:11px;background:var(--bg);border:1px solid var(--rule);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--accent-ink)}
.card-txt{flex:1;min-width:0}
.card-txt h3{font-size:15.5px;font-weight:600;margin:0;line-height:1.3}
.card-txt p{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.card-badge{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;margin-top:5px}
.card-ir{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.card-ir svg{width:17px;height:17px}
.card-copiar{flex:none;width:34px;height:34px;border:0;background:none;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.card-copiar:active{background:var(--bg)}
.card-copiar svg{width:16px;height:16px}
.card-copiar.hecho{color:var(--accent-ink)}

footer{margin-top:30px;font-size:12.5px;text-align:center}
noscript p{padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand"><img src="logo.png" alt="Rindes y Cultivos DAS · Gente de Campo" width="416" height="76"></span>
    <button class="btn-instalar" id="btnInstalar" hidden>Instalar app</button>
  </header>

  <h1>Accesos</h1>
  <p class="sub muted" id="sub">Cargando…</p>

  <button class="compartir" id="btnCompartir" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    <span>Compartir este portal<small>Un solo link con todo, para mandar por WhatsApp</small></span>
  </button>
  <p class="copiado" id="copiadoPortal" aria-live="polite"></p>

  <div class="seccion">
    <h2>Nuestras apps</h2>
    <p class="desc muted">Tocá una para abrirla. Se actualizan solas.</p>
    <ul class="grid" id="gridApps"></ul>
  </div>

  <div class="seccion" id="seccionOtros" hidden>
    <h2>Otros accesos del equipo</h2>
    <p class="desc muted">No son nuestras, tienen su propio inicio de sesión.</p>
    <ul class="grid" id="gridOtros"></ul>
  </div>

  <footer class="muted" id="pie"></footer>
  <noscript><p>Esta app necesita JavaScript para mostrar los accesos.</p></noscript>
</div>

<script>
(function(){
'use strict';

var KEY_DATOS = 'rycdas-portal-datos';
var CADA_MS   = 3 * 60 * 1000;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function fechaAR(iso){ var p = (iso||'').split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : (iso||''); }

var ICONO_IR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';
var ICONO_COPIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var ICONO_TILDE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function iniciales(nombre){
  var pal = nombre.trim().split(/\s+/).filter(function(w){ return w.length>2 || /^[A-ZÁÉÍÓÚÑ]/.test(w); });
  var usa = pal.length >= 2 ? pal.slice(0,2) : nombre.trim().split(/\s+/).slice(0,2);
  return usa.map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2);
}

function copiar(txt){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise(function(ok,mal){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var bien = false; try{ bien = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    bien ? ok() : mal(new Error('copy'));
  });
}

function fila(app,externa){
  return '<li class="card" data-url="' + esc(app.url) + '" role="link" tabindex="0">' +
    '<span class="mono">' + esc(iniciales(app.nombre)) + '</span>' +
    '<div class="card-txt"><h3>' + esc(app.nombre) + '</h3><p>' + esc(app.resumen) + '</p>' +
    (externa ? '<span class="card-badge">Externa</span>' : '') + '</div>' +
    '<button class="card-copiar" type="button" data-url="' + esc(app.url) + '" aria-label="Copiar link de ' + esc(app.nombre) + '">' + ICONO_COPIAR + '</button>' +
    '<span class="card-ir" aria-hidden="true">' + ICONO_IR + '</span>' +
  '</li>';
}

function usar(d){
  var apps = d.apps || [], otros = d.otros || [];
  $('sub').textContent = 'Todas las herramientas del equipo · actualizado al ' + fechaAR(d.actualizado);
  $('gridApps').innerHTML = apps.map(function(a){ return fila(a,false); }).join('');
  if(otros.length){
    $('gridOtros').innerHTML = otros.map(function(a){ return fila(a,true); }).join('');
    $('seccionOtros').hidden = false;
  } else {
    $('seccionOtros').hidden = true;
  }
  $('pie').textContent = 'Rindes y Cultivos DAS · ' + (apps.length + otros.length) + (apps.length + otros.length === 1 ? ' acceso' : ' accesos');
}

function abrirTarjeta(li){
  var url = li.dataset.url;
  if(url) window.open(url, '_blank', 'noopener');
}

document.body.addEventListener('click', function(e){
  var cp = e.target.closest('.card-copiar');
  if(cp){
    e.stopPropagation();
    copiar(cp.dataset.url).then(function(){
      cp.classList.add('hecho');
      var orig = cp.innerHTML;
      cp.innerHTML = ICONO_TILDE;
      setTimeout(function(){ cp.innerHTML = orig; cp.classList.remove('hecho'); }, 1400);
    }).catch(function(){});
    return;
  }
  var li = e.target.closest('.card');
  if(li) abrirTarjeta(li);
});
document.body.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var li = e.target.closest('.card');
  if(!li) return;
  e.preventDefault(); abrirTarjeta(li);
});

$('btnCompartir').addEventListener('click', function(){
  var url = location.href.split('?')[0].split('#')[0];
  var msg = '*Rindes y Cultivos DAS*\nTodas nuestras herramientas, en un solo link:\n' + url;
  var btn = this;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  copiar(url).then(function(){
    $('copiadoPortal').textContent = 'Listo — el link también quedó copiado.';
    setTimeout(function(){ $('copiadoPortal').textContent = ''; }, 3000);
  }).catch(function(){});
});

/* ---- carga de datos (red primero, con copia guardada como respaldo) ---- */
function traer(ms){
  var f = fetch('apps.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  });
  if(!ms) return f;
  return new Promise(function(ok,mal){
    var t = setTimeout(function(){ mal(new Error('timeout')); }, ms);
    f.then(function(d){ clearTimeout(t); ok(d); }, function(e){ clearTimeout(t); mal(e); });
  });
}
function copiaGuardada(){
  try{ var d = JSON.parse(lsGet(KEY_DATOS)); return d && (d.apps || d.otros) ? d : null; }catch(e){ return null; }
}

function iniciar(){
  var guardada = copiaGuardada();
  traer(guardada ? 4000 : 0).catch(function(){ return guardada; }).then(function(d){
    if(!d){ $('sub').textContent = 'No se pudo cargar. Revisá la conexión y volvé a abrir la app.'; return; }
    lsSet(KEY_DATOS, JSON.stringify(d));
    usar(d);
  });
}
function chequear(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); }).catch(function(){}); }
  traer().then(function(d){ lsSet(KEY_DATOS, JSON.stringify(d)); usar(d); }).catch(function(){});
}
setInterval(chequear, CADA_MS);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) chequear(); });
window.addEventListener('online', chequear);
iniciar();

/* ---- instalación ---- */
var promptInstalar = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); promptInstalar = e; $('btnInstalar').hidden = false;
});
$('btnInstalar').addEventListener('click', function(){
  if(!promptInstalar) return;
  promptInstalar.prompt();
  promptInstalar.userChoice.then(function(){ promptInstalar = null; $('btnInstalar').hidden = true; });
});
window.addEventListener('appinstalled', function(){ $('btnInstalar').hidden = true; });

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
