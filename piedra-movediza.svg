<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 84" role="img" aria-label="Piedra Movediza de Tandil">
  <!-- © 2026 Ing. Agr. Franco Martignoni, MP 4749 — ilustración de la Piedra Movediza (Tandil) -->
  <defs>
    <clipPath id="marco"><rect width="124" height="84" rx="12"/></clipPath>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93C1E2"/>
      <stop offset="1" stop-color="#E4F0F7"/>
    </linearGradient>
    <linearGradient id="roca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0B9BC"/>
      <stop offset=".6" stop-color="#8A9598"/>
      <stop offset="1" stop-color="#6C777B"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#marco)">
    <rect width="124" height="84" fill="url(#cielo)"/>
    <circle cx="20" cy="18" r="6.5" fill="#FFF3D1"/>
    <!-- sierras de fondo -->
    <path d="M0 64 C12 56 24 54 36 58 C48 62 58 55 72 54 C88 53 104 58 124 55 L124 84 L0 84 Z" fill="#AFC6B1"/>
    <!-- cerro: pasto a la izquierda, granito arriba y precipicio a la derecha -->
    <path d="M0 84 L0 70 C10 66 22 63 34 62 C48 61 62 60.5 79 60.5 C84 64 88 72 90 84 Z" fill="#5F8563"/>
    <path d="M30 62.4 C44 61.2 60 60.4 79 60.5 C84 64 88 72 90 84 L80 84 C78 76 75 70 70 66 C58 64.5 44 64 30 62.4 Z" fill="#8C9693"/>
    <path d="M79 60.5 C84 64 88 72 90 84 L85 84 C83.5 75 81 68 77 63.5 Z" fill="#6A7572"/>
    <ellipse cx="14" cy="69" rx="5.5" ry="2.8" fill="#8E999C"/>
    <ellipse cx="26" cy="66.5" rx="3.6" ry="2" fill="#9AA4A7"/>
    <!-- la piedra: apoyada en un punto del borde y volcada sobre el vacío -->
    <ellipse cx="72" cy="60.6" rx="6" ry="1.2" fill="#2F3B35" opacity=".35"/>
    <path d="M72 60.3 L62 57.2 Q51.5 53 51 44.5 Q51 35 60 30.5 L78 24.2 Q92 22 99.5 30 Q105.5 38 99.5 47.5 L88.5 56 Q80.5 60.8 72 60.3 Z" fill="url(#roca)"/>
    <path d="M99.5 30 Q105.5 38 99.5 47.5 L88.5 56 Q80.5 60.8 72 60.3 L84.5 52.5 Q95 44.5 99.5 30 Z" fill="#5E696D"/>
    <path d="M57.5 33.5 Q66 27.5 77.5 25.6" fill="none" stroke="#D3DADC" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <path d="M78 24.6 L81.5 37.5 L90 45" fill="none" stroke="#727E82" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
    <path d="M60.5 31 L64.5 42 L62 57" fill="none" stroke="#7D888C" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
  </g>
</svg>
